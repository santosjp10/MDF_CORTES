name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar dependências Node
      run: npm install

    - name: Conferir se o jsPDF está embutido no projeto
      run: |
        test -s www/assets/js/jspdf.umd.min.js
        head -c 200 www/assets/js/jspdf.umd.min.js | grep -qi "jspdf" \
          || { echo "ERRO: jspdf.umd.min.js parece inválido"; exit 1; }

    - name: Adicionar plataforma Android
      run: npx cap add android

    - name: Gerar ícones e splash a partir de assets/
      run: npx @capacitor/assets generate --android

    - name: Sincronizar web assets e plugins com o Android
      run: npx cap sync android

    - name: Dar permissão de execução ao Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK de debug
      run: cd android && ./gradlew assembleDebug --stacktrace

    - name: Fazer upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: OtimizadorCorte-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
