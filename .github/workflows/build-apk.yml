name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar dependências Node
      run: npm install

    - name: Criar diretório de assets
      run: mkdir -p www/assets/js

    - name: Baixar jsPDF (offline)
      run: curl -L -o www/assets/js/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

    - name: Adicionar plataforma Android (se necessário)
      run: npx cap add android

    - name: Gerar ícones Android
      run: npx @capacitor/assets generate --android

    - name: Sincronizar web assets com Android
      run: npx cap sync android

    - name: Dar permissão de execução ao Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK de debug
      run: cd android && ./gradlew assembleDebug

    - name: Fazer upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: OtimizadorCorte-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk