<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otimizador de Corte de Chapas - v2.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #1a3e72; }
        .panel { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; min-width: 120px; }
        label { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        input, select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 16px; background: #1a3e72; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0f2a50; }
        button.danger { background: #c0392b; }
        button.danger:hover { background: #a93226; }
        button.success { background: #27ae60; }
        button.success:hover { background: #1e8449; }
        button.secondary { background: #7f8c8d; }
        button.secondary:hover { background: #6c7a7d; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; }
        .btn-small { padding: 4px 8px; font-size: 12px; margin: 0 2px; }
        .canvas-container { overflow-x: auto; margin-top: 20px; text-align: center; }
        canvas { border: 1px solid #ccc; background: #fff; max-width: 100%; }
        .stats { margin-top: 10px; font-weight: bold; background: #eaf2f8; padding: 10px; border-radius: 4px; }
        .project-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .csv-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <h1>📐 Otimizador de Corte de Chapas</h1>

    <div class="panel">
        <h3>⚙️ Configuração</h3>
        <div class="flex-row">
            <div class="form-group">
                <label>Folga da serra (kerf) mm</label>
                <input type="number" id="kerf" value="3" step="0.1" min="0">
            </div>
            <div class="form-group">
                <label>Nº de tentativas</label>
                <input type="number" id="tentativas" value="100" min="10" max="500" step="10">
                <small style="color:gray;">(quanto mais, melhor)</small>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>🟫 Chapas Disponíveis</h3>
        <div class="flex-row">
            <div class="form-group"><label>Largura (mm)</label><input type="number" id="chapaLargura" value="2750" step="1"></div>
            <div class="form-group"><label>Comprimento (mm)</label><input type="number" id="chapaComprimento" value="1830" step="1"></div>
            <div class="form-group"><label>Espessura (mm)</label><input type="number" id="chapaEspessura" value="15" step="0.1"></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="chapaQuantidade" value="5" min="1"></div>
            <button onclick="adicionarChapa()">+ Adicionar Chapa</button>
        </div>
        <table id="tabelaChapas">
            <thead><tr><th>Largura</th><th>Comprimento</th><th>Espessura</th><th>Qtd</th><th>Ações</th></tr></thead>
            <tbody></tbody>
        </table>
        <div class="csv-actions">
            <button class="secondary" onclick="exportarCSV('chapas')">📤 Exportar Chapas CSV</button>
            <button class="secondary" onclick="importarCSV('chapas')">📥 Importar Chapas CSV</button>
        </div>
    </div>

    <div class="panel">
        <h3>🧩 Peças a Cortar</h3>
        <div class="flex-row">
            <div class="form-group"><label>Nome</label><input type="text" id="pecaNome" placeholder="Ex: Lateral Esq." style="width:150px;"></div>
            <div class="form-group"><label>Largura (mm)</label><input type="number" id="pecaLargura" value="600" step="1"></div>
            <div class="form-group"><label>Comprimento (mm)</label><input type="number" id="pecaComprimento" value="400" step="1"></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="pecaQuantidade" value="10" min="1"></div>
            <div class="form-group"><label>Espessura (mm)</label><input type="number" id="pecaEspessura" value="15" step="0.1"></div>
            <div class="form-group">
                <label>Orientação</label>
                <select id="pecaOrientacao">
                    <option value="livre">Livre (girar 90°)</option>
                    <option value="fixa">Fixa (sem rotação)</option>
                </select>
            </div>
            <button onclick="adicionarPeca()">+ Adicionar Peça</button>
        </div>
        <table id="tabelaPecas">
            <thead><tr><th>Nome</th><th>Largura</th><th>Comprimento</th><th>Espessura</th><th>Qtd</th><th>Orientação</th><th>Ações</th></tr></thead>
            <tbody></tbody>
        </table>
        <div class="csv-actions">
            <button class="secondary" onclick="exportarCSV('pecas')">📤 Exportar Peças CSV</button>
            <button class="secondary" onclick="importarCSV('pecas')">📥 Importar Peças CSV</button>
        </div>
    </div>

    <div class="panel">
        <h3>💾 Projeto</h3>
        <div class="project-actions">
            <button onclick="salvarProjeto()">💾 Salvar Projeto</button>
            <button onclick="carregarProjeto()">📂 Carregar Projeto</button>
            <button class="danger" onclick="limparTudo()">🗑️ Limpar Tudo</button>
        </div>
    </div>

    <div class="panel" style="text-align: center;">
        <button onclick="otimizar()" style="font-size: 18px; padding: 12px 30px;">🔍 Otimizar Corte</button>
        <button onclick="reotimizar()" style="font-size: 18px; padding: 12px 30px; margin-left: 10px;">🔄 Reotimizar</button>
        <button onclick="exportarPDF()" style="font-size: 18px; padding: 12px 30px; margin-left: 10px;" class="success">📄 Exportar PDF</button>
    </div>

    <div class="panel" id="resultadoPanel" style="display: none;">
        <h3>📊 Resultado do Plano de Corte</h3>
        <div id="estatisticas" class="stats"></div>
        <div class="canvas-container">
            <canvas id="canvasCorte"></canvas>
        </div>
    </div>
</div>

<script>
    // ========== DADOS ==========
    let chapas = [];
    let pecas = [];
    let canvas = null;
    let ctx = null;
    let melhorSolucaoGlobal = null;

    // ========== UI ==========
    function adicionarChapa() {
        const l = parseFloat(document.getElementById('chapaLargura').value);
        const c = parseFloat(document.getElementById('chapaComprimento').value);
        const e = parseFloat(document.getElementById('chapaEspessura').value);
        const q = parseInt(document.getElementById('chapaQuantidade').value);
        if (isNaN(l) || isNaN(c) || isNaN(e) || isNaN(q) || l<=0 || c<=0 || e<=0 || q<=0) {
            alert('Preencha todos os campos da chapa corretamente.');
            return;
        }
        chapas.push({ id: Date.now(), largura: l, comprimento: c, espessura: e, quantidade: q });
        atualizarTabelaChapas();
    }

    function removerChapa(id) {
        chapas = chapas.filter(ch => ch.id !== id);
        atualizarTabelaChapas();
    }

    function atualizarTabelaChapas() {
        const tbody = document.querySelector('#tabelaChapas tbody');
        tbody.innerHTML = '';
        chapas.forEach(ch => {
            tbody.innerHTML += `<tr>
                <td>${ch.largura}</td><td>${ch.comprimento}</td><td>${ch.espessura}</td><td>${ch.quantidade}</td>
                <td><button class="btn-small danger" onclick="removerChapa(${ch.id})">Remover</button></td>
            </tr>`;
        });
    }

    function adicionarPeca() {
        const nome = document.getElementById('pecaNome').value.trim();
        const l = parseFloat(document.getElementById('pecaLargura').value);
        const c = parseFloat(document.getElementById('pecaComprimento').value);
        const q = parseInt(document.getElementById('pecaQuantidade').value);
        const e = parseFloat(document.getElementById('pecaEspessura').value);
        const orient = document.getElementById('pecaOrientacao').value;
        if (isNaN(l) || isNaN(c) || isNaN(e) || isNaN(q) || l<=0 || c<=0 || e<=0 || q<=0) {
            alert('Preencha todos os campos numéricos da peça corretamente.');
            return;
        }
        const nomeFinal = nome || `Peça ${Date.now()}`;
        pecas.push({ id: Date.now(), nome: nomeFinal, largura: l, comprimento: c, quantidade: q, espessura: e, orientacao: orient });
        atualizarTabelaPecas();
        document.getElementById('pecaNome').value = '';
        document.getElementById('pecaLargura').value = 600;
        document.getElementById('pecaComprimento').value = 400;
        document.getElementById('pecaQuantidade').value = 10;
        document.getElementById('pecaEspessura').value = 15;
        document.getElementById('pecaOrientacao').value = 'livre';
    }

    function removerPeca(id) {
        pecas = pecas.filter(p => p.id !== id);
        atualizarTabelaPecas();
    }

    function atualizarTabelaPecas() {
        const tbody = document.querySelector('#tabelaPecas tbody');
        tbody.innerHTML = '';
        pecas.forEach(p => {
            tbody.innerHTML += `<tr>
                <td>${p.nome}</td><td>${p.largura}</td><td>${p.comprimento}</td><td>${p.espessura}</td><td>${p.quantidade}</td>
                <td>${p.orientacao === 'livre' ? 'Livre' : 'Fixa'}</td>
                <td><button class="btn-small danger" onclick="removerPeca(${p.id})">Remover</button></td>
            </tr>`;
        });
    }

    function limparTudo() {
        if (!confirm('Tem certeza que deseja limpar chapas e peças?')) return;
        chapas = [];
        pecas = [];
        melhorSolucaoGlobal = null;
        atualizarTabelaChapas();
        atualizarTabelaPecas();
        document.getElementById('resultadoPanel').style.display = 'none';
    }

    // ========== CSV ==========
    function exportarCSV(tipo) {
        let csvContent = '';
        let filename = '';
        if (tipo === 'chapas') {
            if (chapas.length === 0) { alert('Nenhuma chapa cadastrada.'); return; }
            csvContent = 'largura,comprimento,espessura,quantidade\n';
            chapas.forEach(ch => csvContent += `${ch.largura},${ch.comprimento},${ch.espessura},${ch.quantidade}\n`);
            filename = 'chapas.csv';
        } else if (tipo === 'pecas') {
            if (pecas.length === 0) { alert('Nenhuma peça cadastrada.'); return; }
            csvContent = 'nome,largura,comprimento,quantidade,espessura,orientacao\n';
            pecas.forEach(p => csvContent += `"${p.nome}",${p.largura},${p.comprimento},${p.quantidade},${p.espessura},${p.orientacao}\n`);
            filename = 'pecas.csv';
        }
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importarCSV(tipo) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.csv';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const texto = event.target.result;
                const linhas = texto.split(/\r?\n/).filter(l => l.trim() !== '');
                if (linhas.length < 2) { alert('Arquivo CSV vazio.'); return; }
                const cabecalho = linhas[0].toLowerCase();
                if (tipo === 'chapas') {
                    if (!cabecalho.includes('largura')) { alert('Cabeçalho inválido.'); return; }
                    const novas = [];
                    for (let i = 1; i < linhas.length; i++) {
                        const cols = linhas[i].split(',').map(c => c.trim());
                        if (cols.length < 4) continue;
                        const [l, c, e, q] = [parseFloat(cols[0]), parseFloat(cols[1]), parseFloat(cols[2]), parseInt(cols[3])];
                        if ([l, c, e, q].some(v => isNaN(v) || v <= 0)) continue;
                        novas.push({ id: Date.now() + i, largura: l, comprimento: c, espessura: e, quantidade: q });
                    }
                    if (novas.length === 0) { alert('Nenhuma chapa válida.'); return; }
                    if (confirm('Substituir chapas atuais? Cancelar = acrescentar.')) chapas = novas;
                    else chapas.push(...novas);
                    atualizarTabelaChapas();
                    alert(`${novas.length} chapas importadas.`);
                } else if (tipo === 'pecas') {
                    if (!cabecalho.includes('nome')) { alert('Cabeçalho inválido. Esperado: nome,largura,comprimento,quantidade,espessura,orientacao'); return; }
                    const novas = [];
                    for (let i = 1; i < linhas.length; i++) {
                        const cols = linhas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                        if (cols.length < 6) continue;
                        const [nome, l, c, q, e, orient] = cols;
                        const largura = parseFloat(l), comprimento = parseFloat(c), quantidade = parseInt(q), espessura = parseFloat(e);
                        const orientacao = orient.toLowerCase();
                        if ([largura, comprimento, quantidade, espessura].some(v => isNaN(v) || v <= 0)) continue;
                        if (orientacao !== 'livre' && orientacao !== 'fixa') continue;
                        novas.push({ id: Date.now() + i, nome: nome || `Peça ${i}`, largura, comprimento, quantidade, espessura, orientacao });
                    }
                    if (novas.length === 0) { alert('Nenhuma peça válida.'); return; }
                    if (confirm('Substituir peças atuais? Cancelar = acrescentar.')) pecas = novas;
                    else pecas.push(...novas);
                    atualizarTabelaPecas();
                    alert(`${novas.length} peças importadas.`);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // ========== ALGORITMO MAXRECTS ==========
    class MaxRectsPacker {
        constructor(width, height, kerf) {
            this.binWidth = width;
            this.binHeight = height;
            this.kerf = kerf;
            this.freeRects = [{ x: 0, y: 0, width: width, height: height }];
            this.placements = [];
        }

        placeRectangle(rectWidth, rectHeight, canRotate) {
            let bestScore1 = Infinity, bestScore2 = Infinity;
            let bestPlacement = null;
            let orientations = [{ w: rectWidth, h: rectHeight, rotated: false }];
            if (canRotate && rectWidth !== rectHeight) {
                orientations.push({ w: rectHeight, h: rectWidth, rotated: true });
            }

            for (let o of orientations) {
                let rw = o.w + this.kerf;
                let rh = o.h + this.kerf;
                for (let i = 0; i < this.freeRects.length; i++) {
                    let fr = this.freeRects[i];
                    if (rw <= fr.width && rh <= fr.height) {
                        let leftoverHoriz = Math.abs(fr.width - rw);
                        let leftoverVert = Math.abs(fr.height - rh);
                        let shortSideFit = Math.min(leftoverHoriz, leftoverVert);
                        let longSideFit = Math.max(leftoverHoriz, leftoverVert);
                        if (shortSideFit < bestScore1 || (shortSideFit === bestScore1 && longSideFit < bestScore2)) {
                            bestScore1 = shortSideFit;
                            bestScore2 = longSideFit;
                            bestPlacement = { freeIndex: i, x: fr.x, y: fr.y, width: rw, height: rh, rotated: o.rotated };
                        }
                    }
                }
            }

            if (bestPlacement) {
                let fr = this.freeRects[bestPlacement.freeIndex];
                this.freeRects.splice(bestPlacement.freeIndex, 1);
                this.splitFreeRect(fr, bestPlacement);
                this.placements.push({
                    x: bestPlacement.x,
                    y: bestPlacement.y,
                    width: bestPlacement.width - this.kerf,
                    height: bestPlacement.height - this.kerf,
                    rotated: bestPlacement.rotated
                });
                this.pruneFreeRects();
                return bestPlacement;
            }
            return null;
        }

        splitFreeRect(freeRect, used) {
            let rx = used.x, ry = used.y, rw = used.width, rh = used.height;
            let fx = freeRect.x, fy = freeRect.y, fw = freeRect.width, fh = freeRect.height;

            let right1 = { x: rx + rw, y: ry, width: fx + fw - (rx + rw), height: rh };
            let bottom1 = { x: fx, y: ry + rh, width: fw, height: fy + fh - (ry + rh) };
            let area1 = (right1.width > 0 && right1.height > 0 ? right1.width * right1.height : 0) +
                        (bottom1.width > 0 && bottom1.height > 0 ? bottom1.width * bottom1.height : 0);

            let bottom2 = { x: rx, y: ry + rh, width: rw, height: fy + fh - (ry + rh) };
            let right2 = { x: rx + rw, y: fy, width: fx + fw - (rx + rw), height: fh };
            let area2 = (bottom2.width > 0 && bottom2.height > 0 ? bottom2.width * bottom2.height : 0) +
                        (right2.width > 0 && right2.height > 0 ? right2.width * right2.height : 0);

            if (area1 >= area2) {
                if (right1.width > 0 && right1.height > 0) this.freeRects.push(right1);
                if (bottom1.width > 0 && bottom1.height > 0) this.freeRects.push(bottom1);
            } else {
                if (bottom2.width > 0 && bottom2.height > 0) this.freeRects.push(bottom2);
                if (right2.width > 0 && right2.height > 0) this.freeRects.push(right2);
            }
        }

        pruneFreeRects() {
            for (let i = this.freeRects.length - 1; i >= 0; i--) {
                for (let j = 0; j < this.freeRects.length; j++) {
                    if (i === j) continue;
                    let a = this.freeRects[i], b = this.freeRects[j];
                    if (b.x <= a.x && b.y <= a.y &&
                        b.x + b.width >= a.x + a.width &&
                        b.y + b.height >= a.y + a.height) {
                        this.freeRects.splice(i, 1);
                        break;
                    }
                }
            }
        }
    }

    // ========== OTIMIZAÇÃO COM MÚLTIPLAS ORDENAÇÕES INICIAIS ==========
    function packBins(bins, rects, kerf, numAttempts = 100) {
        let bestSolution = null;
        let bestBinsUsed = Infinity;
        let bestAreaUtil = 0;
        const baseRects = rects.map(r => ({ ...r }));

        function tryPack(order) {
            let placementsPerBin = [];
            let packers = [];
            for (let rect of order) {
                let placed = false;
                for (let i = 0; i < packers.length; i++) {
                    let placement = packers[i].placeRectangle(rect.width, rect.height, rect.canRotate);
                    if (placement) {
                        placementsPerBin[i].push({
                            x: placement.x, y: placement.y,
                            width: placement.width, height: placement.height,
                            rotated: placement.rotated,
                            id: rect.id, nome: rect.nome, largura: rect.width, comprimento: rect.height
                        });
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    if (packers.length < bins.length) {
                        let newPacker = new MaxRectsPacker(bins[packers.length].width, bins[packers.length].height, kerf);
                        packers.push(newPacker);
                        placementsPerBin.push([]);
                        let placement = newPacker.placeRectangle(rect.width, rect.height, rect.canRotate);
                        if (placement) {
                            placementsPerBin[packers.length - 1].push({
                                x: placement.x, y: placement.y,
                                width: placement.width, height: placement.height,
                                rotated: placement.rotated,
                                id: rect.id, nome: rect.nome, largura: rect.width, comprimento: rect.height
                            });
                        } else return null;
                    } else return null;
                }
            }
            return { placementsPerBin, totalBins: packers.length };
        }

        function evaluateAndUpdate(result) {
            if (!result) return;
            let binsUsed = result.totalBins;
            let totalAreaBins = bins.slice(0, binsUsed).reduce((s, b) => s + b.width * b.height, 0);
            let totalAreaUsed = 0;
            result.placementsPerBin.forEach(p => totalAreaUsed += p.reduce((s, r) => s + r.width * r.height, 0));
            let areaUtil = totalAreaBins > 0 ? totalAreaUsed / totalAreaBins : 0;
            if (binsUsed < bestBinsUsed || (binsUsed === bestBinsUsed && areaUtil > bestAreaUtil)) {
                bestBinsUsed = binsUsed;
                bestAreaUtil = areaUtil;
                bestSolution = { placementsPerBin: result.placementsPerBin, binsUsed, areaUtil };
            }
        }

        // 1. Tentativas com ordenações inteligentes (determinísticas)
        const orders = [
            [...baseRects].sort((a, b) => (b.width * b.height) - (a.width * a.height)),                // área decrescente
            [...baseRects].sort((a, b) => Math.max(b.width, b.height) - Math.max(a.width, a.height)),   // maior lado
            [...baseRects].sort((a, b) => b.width - a.width || b.height - a.height),                   // largura decrescente
            [...baseRects].sort((a, b) => b.height - a.height || b.width - a.width)                    // altura decrescente
        ];
        for (let order of orders) {
            evaluateAndUpdate(tryPack(order));
            if (bestBinsUsed === 1 && bestAreaUtil > 0.999) return bestSolution; // solução ótima encontrada
        }

        // 2. Tentativas aleatórias adicionais
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }
        for (let att = 0; att < numAttempts; att++) {
            let o = [...baseRects];
            shuffle(o);
            evaluateAndUpdate(tryPack(o));
            if (bestBinsUsed === 1 && bestAreaUtil > 0.999) break;
        }
        return bestSolution;
    }

    // ========== INTERFACE DE OTIMIZAÇÃO ==========
    function otimizar() {
        if (chapas.length === 0 || pecas.length === 0) {
            alert('Cadastre ao menos uma chapa e uma peça.');
            return;
        }
        const kerf = parseFloat(document.getElementById('kerf').value) || 0;
        const numTent = parseInt(document.getElementById('tentativas').value) || 100;

        let espessuras = new Set(pecas.map(p => p.espessura));
        let todosPlanos = [];

        for (let esp of espessuras) {
            let pecasFiltradas = pecas.filter(p => p.espessura === esp);
            let chapasFiltradas = chapas.filter(ch => ch.espessura === esp);
            if (chapasFiltradas.length === 0) {
                alert(`Nenhuma chapa cadastrada para espessura ${esp} mm.`);
                return;
            }
            let bins = [];
            chapasFiltradas.forEach(ch => { for (let i = 0; i < ch.quantidade; i++) bins.push({ width: ch.largura, height: ch.comprimento }); });
            let rects = [];
            pecasFiltradas.forEach(p => {
                for (let i = 0; i < p.quantidade; i++) {
                    rects.push({
                        width: p.largura,
                        height: p.comprimento,
                        canRotate: p.orientacao === 'livre',
                        id: p.id,
                        nome: p.nome
                    });
                }
            });

            for (let r of rects) {
                let cabe = bins.some(b => (r.width <= b.width && r.height <= b.height) || (r.canRotate && r.height <= b.width && r.width <= b.height));
                if (!cabe) {
                    alert(`Peça "${r.nome}" (${r.width}x${r.height}) não cabe em nenhuma chapa de ${esp} mm.`);
                    return;
                }
            }
            let resultado = packBins(bins, rects, kerf, numTent);
            if (!resultado) {
                alert(`Não foi possível alocar todas as peças de espessura ${esp} mm. Aumente o número de chapas ou as tentativas.`);
                return;
            }
            let planosEsp = {
                espessura: esp,
                bins: resultado.placementsPerBin.map((placements, idx) => ({
                    width: bins[idx].width,
                    height: bins[idx].height,
                    pecas: placements
                }))
            };
            todosPlanos.push(planosEsp);
        }

        melhorSolucaoGlobal = todosPlanos;
        desenharResultado(todosPlanos, kerf);
        document.getElementById('resultadoPanel').style.display = 'block';
    }

    function reotimizar() { otimizar(); }

    // ========== DESENHO ==========
    function desenharResultado(planos, kerf) {
        canvas = document.getElementById('canvasCorte');
        ctx = canvas.getContext('2d');
        let totalHeight = 0, maxWidth = 0;
        planos.forEach(p => p.bins.forEach(b => { maxWidth = Math.max(maxWidth, b.width); totalHeight += b.height + 30; }));
        let escala = maxWidth > 1200 ? 1200 / maxWidth : 1;
        canvas.width = maxWidth * escala + 350;
        canvas.height = totalHeight * escala + 40;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let yAtual = 20;
        planos.forEach(plano => {
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText(`Espessura: ${plano.espessura} mm`, 10, yAtual - 5);
            yAtual += 15;
            plano.bins.forEach((bin, idx) => {
                let xBase = 20, yBase = yAtual;
                ctx.fillStyle = '#f5f5dc';
                ctx.fillRect(xBase, yBase, bin.width * escala, bin.height * escala);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(xBase, yBase, bin.width * escala, bin.height * escala);
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';
                ctx.fillText(`Chapa ${idx + 1} (${bin.width}x${bin.height})`, xBase + 4, yBase - 5);
                let areaUsada = bin.pecas.reduce((s, p) => s + p.width * p.height, 0);
                let ap = ((areaUsada / (bin.width * bin.height)) * 100).toFixed(1);
                ctx.fillText(`Aprov: ${ap}%`, xBase + bin.width * escala + 10, yBase + 15);

                let cores = ['#FFB3BA', '#BAFFC9', '#BAE1FF', '#FFFFBA', '#E8BAFF', '#FFD9BA', '#D9BAFF', '#FFC9BA'];
                bin.pecas.forEach((p, i) => {
                    ctx.fillStyle = cores[i % cores.length];
                    ctx.fillRect(xBase + p.x * escala, yBase + p.y * escala, p.width * escala, p.height * escala);
                    ctx.strokeStyle = '#333';
                    ctx.strokeRect(xBase + p.x * escala, yBase + p.y * escala, p.width * escala, p.height * escala);
                    ctx.fillStyle = '#000';
                    let cx = xBase + p.x * escala + (p.width * escala) / 2;
                    let cy = yBase + p.y * escala + (p.height * escala) / 2;
                    let fontSize = Math.max(8, Math.min(12, (p.width * escala * 0.15)));
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.nome, cx, cy - fontSize * 0.6);
                    let dimTexto = `(${p.largura.toFixed(0)}x${p.comprimento.toFixed(0)}${p.rotated ? '↻' : ''})`;
                    ctx.font = `${fontSize * 0.85}px Arial`;
                    ctx.fillText(dimTexto, cx, cy + fontSize * 0.7);
                });
                yAtual += bin.height * escala + 30;
            });
            yAtual += 10;
        });
        atualizarEstatisticas(planos);
    }

    function atualizarEstatisticas(planos) {
        let ch = 0, aTotal = 0, aUsada = 0;
        planos.forEach(p => p.bins.forEach(b => { ch++; aTotal += b.width * b.height; aUsada += b.pecas.reduce((s, p) => s + p.width * p.height, 0); }));
        document.getElementById('estatisticas').innerHTML = `Chapas: ${ch} | Área total: ${(aTotal / 1e6).toFixed(3)} m² | Aproveitamento geral: ${((aUsada / aTotal) * 100).toFixed(1)}%`;
    }

    // ========== SALVAR / CARREGAR ==========
    function salvarProjeto() {
        const nome = prompt('Nome do projeto:', 'projeto_' + new Date().toISOString().slice(0, 10));
        if (!nome) return;
        const proj = { chapas, pecas, kerf: document.getElementById('kerf').value };
        localStorage.setItem('otimizador_projetos', JSON.stringify({ ...JSON.parse(localStorage.getItem('otimizador_projetos') || '{}'), [nome]: proj }));
        alert('Projeto salvo!');
    }

    function carregarProjeto() {
        const projs = JSON.parse(localStorage.getItem('otimizador_projetos') || '{}');
        const nomes = Object.keys(projs);
        if (nomes.length === 0) { alert('Nenhum projeto salvo.'); return; }
        const nome = prompt('Projetos:\n' + nomes.join('\n') + '\n\nNome para carregar:');
        if (!nome || !projs[nome]) { alert('Não encontrado.'); return; }
        const p = projs[nome];
        chapas = p.chapas.map(c => ({ ...c }));
        pecas = p.pecas.map(p => ({ ...p }));
        document.getElementById('kerf').value = p.kerf || 3;
        atualizarTabelaChapas();
        atualizarTabelaPecas();
        melhorSolucaoGlobal = null;
        document.getElementById('resultadoPanel').style.display = 'none';
        alert('Projeto carregado.');
    }

       // ========== PDF (RETRATO, IMAGEM OCUPANDO MÁXIMO ESPAÇO) ==========
    function exportarPDF() {
        if (!melhorSolucaoGlobal || !canvas) { alert('Otimize primeiro.'); return; }
        const { jsPDF } = window.jspdf;
        // Orientação retrato (vertical)
        const doc = new jsPDF('p', 'mm', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();   // 210 mm
        const pageHeight = doc.internal.pageSize.getHeight(); // 297 mm
        const margin = 10;
        const maxWidth = pageWidth - 2 * margin;   // 190 mm
        const maxHeight = pageHeight - 35 - 2 * margin; // ~247 mm (título + stats ocupam uns 12mm)

        // Calcular escala proporcional sem distorção
        const imgWidth = canvas.width;
        const imgHeight = canvas.height;
        const scale = Math.min(maxWidth / imgWidth, maxHeight / imgHeight);
        const w = imgWidth * scale;
        const h = imgHeight * scale;

        // Centralizar horizontalmente
        const x = (pageWidth - w) / 2;
        // Posição vertical: após cabeçalho (título + stats)
        const yHeader = margin + 12; // onde começa a imagem

        // Título e estatísticas (cabeçalho fixo no topo)
        doc.setFontSize(14);
        doc.text('Plano de Corte', pageWidth / 2, margin + 6, { align: 'center' });
        let ch = 0, aT = 0, aU = 0;
        melhorSolucaoGlobal.forEach(p => p.bins.forEach(b => { ch++; aT += b.width * b.height; aU += b.pecas.reduce((s, p) => s + p.width * p.height, 0); }));
        doc.setFontSize(10);
        doc.text(`Chapas: ${ch} | Área total: ${(aT / 1e6).toFixed(3)} m² | Aproveitamento: ${((aU / aT) * 100).toFixed(1)}%`, pageWidth / 2, margin + 12, { align: 'center' });

        // Adicionar imagem do canvas com proporção exata, ocupando o restante da página
        const imgData = canvas.toDataURL('image/png');
        doc.addImage(imgData, 'PNG', x, yHeader + 2, w, h);

        // Se houver detalhamento textual (lista de peças), pode ser colocado em uma nova página
        let yDetalhe = yHeader + 2 + h + 5;
        // Verifica se cabe na mesma página; se não, cria nova
        if (yDetalhe + 20 > pageHeight - margin) {
            doc.addPage();
            yDetalhe = margin;
        }
        doc.setFontSize(9);
        melhorSolucaoGlobal.forEach(plano => {
            plano.bins.forEach((bin, idx) => {
                if (yDetalhe > pageHeight - 20) { doc.addPage(); yDetalhe = margin; }
                doc.text(`Esp. ${plano.espessura}mm - Chapa ${idx + 1} (${bin.width}x${bin.height})`, margin, yDetalhe);
                yDetalhe += 4;
                bin.pecas.forEach(p => {
                    doc.text(`${p.nome} - ${p.largura.toFixed(0)}x${p.comprimento.toFixed(0)} ${p.rotated ? '(rot)' : ''}`, margin + 5, yDetalhe);
                    yDetalhe += 4;
                });
                yDetalhe += 2;
            });
        });

        doc.save('plano_corte.pdf');
    }

    // Inicial
    atualizarTabelaChapas();
    atualizarTabelaPecas();
</script>
